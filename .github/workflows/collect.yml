# 30 分ごと（GitHub の混雑で間引かれることがある）に収集し、緊急案件を LINE に通知、data/ をコミットする。
# 必要な Secrets: LINE_CHANNEL_ACCESS_TOKEN, LINE_TO（任意: ANTHROPIC_API_KEY, NVD_API_KEY, X_BEARER_TOKEN, DASHBOARD_URL）
name: collect
on:
  schedule:
    # 毎時 0 分前後は混雑して間引かれやすいので、時刻をずらす
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "LINE にテスト通知を 1 通だけ送る（収集はしない）"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: ping
        if: ${{ inputs.ping }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python -m noroshi --ping
      - name: collect and notify
        if: ${{ !inputs.ping }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_KEY_EXPIRES: ${{ vars.ANTHROPIC_KEY_EXPIRES }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python -m noroshi --send
      - name: commit data
        if: ${{ !inputs.ping }}
        run: |
          git config user.name "noroshi-bot"
          git config user.email "noroshi-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
