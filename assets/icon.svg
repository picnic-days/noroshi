<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1E3C"/>
      <stop offset="0.6" stop-color="#7A2A3A"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16161C"/>
      <stop offset="0.45" stop-color="#2A2A33"/>
      <stop offset="0.7" stop-color="#121217"/>
      <stop offset="1" stop-color="#24242C"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A34"/>
      <stop offset="1" stop-color="#5A3820"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#sky)"/>

  <!-- 丘 -->
  <path d="M0 540 Q 320 480, 640 540 V640 H0 Z" fill="#0E0F1A"/>

  <!-- 旗竿 -->
  <rect x="200" y="112" width="14" height="420" rx="7" fill="url(#pole)"/>
  <circle cx="207" cy="108" r="13" fill="#F2B544"/>

  <!-- 旗 -->
  <g filter="url(#shadow)">
    <path d="M214 132 C 290 108, 362 156, 476 126 L 476 362 C 384 390, 302 340, 214 366 Z" fill="url(#flag)"/>
  </g>

  <!-- 骨（髑髏の下で交差） -->
  <g stroke="#F5F1E8" stroke-width="14" stroke-linecap="round">
    <line x1="292" y1="288" x2="392" y2="330"/>
    <line x1="292" y1="330" x2="392" y2="288"/>
  </g>
  <g fill="#F5F1E8">
    <circle cx="286" cy="280" r="10"/><circle cx="282" cy="294" r="10"/>
    <circle cx="398" cy="338" r="10"/><circle cx="402" cy="324" r="10"/>
    <circle cx="286" cy="338" r="10"/><circle cx="282" cy="324" r="10"/>
    <circle cx="398" cy="280" r="10"/><circle cx="402" cy="294" r="10"/>
  </g>

  <!-- 髑髏 -->
  <g fill="#F5F1E8">
    <circle cx="342" cy="210" r="46"/>
    <rect x="314" y="232" width="56" height="40" rx="12"/>
  </g>
  <g fill="#16161C">
    <ellipse cx="324" cy="212" rx="13" ry="14"/>
    <ellipse cx="360" cy="212" rx="13" ry="14"/>
    <path d="M342 230 L 334 246 L 350 246 Z"/>
    <rect x="327" y="258" width="4" height="14" rx="2"/>
    <rect x="340" y="258" width="4" height="14" rx="2"/>
    <rect x="353" y="258" width="4" height="14" rx="2"/>
  </g>
</svg>
